name: Bug Report
description: Report a bug in THEORY
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact command(s) or steps that trigger the issue.
      placeholder: |
        1. theory --actor APT28 --sources mitre,otx --output html
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead. Include any error output or tracebacks.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: THEORY version
      description: "Output of: python -c \"from theory._version import __version__; print(__version__)\""
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.4"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15.1 / Ubuntu 24.04 / Windows 11"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help (LLM provider, .env config with keys redacted, screenshots).
    validations:
      required: false
