name: Feature Request
description: Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and why doesn't THEORY support it today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you'd like this to work. CLI syntax examples, output format sketches, or rough ideas are all welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you've tried or other approaches you've thought about.
    validations:
      required: false
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - New source / collector
        - New output format
        - New actor
        - CLI / UX improvement
        - Performance
        - Documentation
        - Other
    validations:
      required: true
