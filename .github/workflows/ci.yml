name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

# Default to read-only GITHUB_TOKEN at workflow level.
# Individual jobs can elevate where they need to.
permissions:
  contents: read

jobs:
  test:
    name: Run Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # pyproject.toml is the canonical dependency source.
        # The [dev] extra pulls in pytest, pytest-cov, ruff, pip-audit.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Create runtime directories
        # .cache/ and output/dossiers/ are gitignored — tests create their
        # own tmp dirs via pytest fixtures, but a few paths still expect
        # these to exist.
        run: |
          mkdir -p .cache output/dossiers

      - name: Run all tests
        run: |
          python -m pytest tests/ -v --tb=short
        env:
          ANTHROPIC_API_KEY: ""
          OTX_API_KEY: ""
          GITHUB_TOKEN: ""

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: .pytest_cache/
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint tooling
        run: pip install ruff pip-audit

      - name: Run ruff
        run: |
          ruff check . --select E,F,W \
            --ignore E501,E402,W291,W292,W293,E701,E702,E731,F401,F541,F841,F811,F821
        # E501 = line too long
        # E402 = module level import not at top
        # W291/W292/W293 = trailing whitespace (ASCII banner lines)
        # E701/E702 = multiple statements on one line (compact style throughout)
        # E731 = lambda assignment (sort-key idiom in html/playbook reporters)
        # F401 = imported but unused (conditional imports in collectors)
        # F541 = f-string without placeholders
        # F841 = local variable assigned but never used
        # F811 = redefinition of unused name (type: ignore comments + proxy pattern)
        # F821 = undefined name (dynamic function insertion pattern in _cli.py)

      - name: Audit dependencies for known vulnerabilities
        # Reads pyproject.toml and checks the resolved tree against the
        # Python Packaging Advisory Database. Initially non-blocking so
        # findings surface without breaking CI — flip to blocking once
        # any baseline advisories are triaged.
        run: pip-audit --strict || true
        continue-on-error: true