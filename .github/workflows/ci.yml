name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

# Default to read-only GITHUB_TOKEN at workflow level.
# Individual jobs can elevate where they need to.
permissions:
  contents: read

jobs:
  test:
    name: Run Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # pyproject.toml is the canonical dependency source.
        # The [dev] extra pulls in pytest, pytest-cov, ruff, pip-audit.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Create runtime directories
        # .cache/ and output/dossiers/ are gitignored — tests create their
        # own tmp dirs via pytest fixtures, but a few paths still expect
        # these to exist.
        run: |
          mkdir -p .cache output/dossiers

      - name: Run all tests
        run: |
          python -m pytest tests/ -v --tb=short
        env:
          ANTHROPIC_API_KEY: ""
          OTX_API_KEY: ""
          GITHUB_TOKEN: ""

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: .pytest_cache/
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint tooling
        run: pip install ruff pip-audit

      - name: Run ruff
        # Configuration lives in pyproject.toml [tool.ruff.lint] — a bare
        # invocation here means local `ruff check .` and CI can never drift.
        run: ruff check .

      - name: Audit dependencies for known vulnerabilities
        # Blocking: the resolved tree was clean at the v2.0 audit, so there
        # is no baseline of known findings to grandfather in. A new advisory
        # should fail the build rather than scroll past in a green log.
        #
        # Audited from a frozen requirement list rather than the environment,
        # because THEORY itself is installed editable and is not on PyPI —
        # `pip-audit --strict` treats "could not be audited" as a failure, so
        # auditing the environment directly fails on the project itself.
        run: |
          pip install -e .
          pip freeze --exclude-editable > /tmp/resolved-requirements.txt
          pip-audit --strict -r /tmp/resolved-requirements.txt

  package:
    name: Wheel builds and works outside the repo
    runs-on: ubuntu-latest
    # The wheel used to ship with no config/*.yaml at all (the package-data
    # glob pointed at a directory that isn't a package), so an installed
    # THEORY silently lost alias resolution. This job fails if that returns.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl

      - name: Run from a directory that is not the repo
        run: |
          mkdir -p /tmp/elsewhere && cd /tmp/elsewhere
          /tmp/smoke/bin/python - <<'PY'
          from collectors.cisa_advisories import ALIAS_TABLE, resolve_canonical
          assert len(ALIAS_TABLE) > 1000, f"alias table did not ship: {len(ALIAS_TABLE)} actors"
          assert resolve_canonical("Fancy Bear") == "APT28"
          print(f"OK — {len(ALIAS_TABLE)} actors available from the installed wheel")
          PY
