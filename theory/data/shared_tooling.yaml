# theory/data/shared_tooling.yaml
# ---------------------------------------------------------------------------
# Software used by so many different operators that an indicator tied to it
# says nothing about WHICH actor is involved.
#
# Why this file exists
# --------------------
# The abuse.ch enrichers (ThreatFox, MalwareBazaar, URLhaus) are queried for
# every malware name in a profile. MITRE's "software used by group" includes
# tools as well as malware, so that list contained Cobalt Strike, Mimikatz,
# PsExec and similar. The IOCs that came back were then written into the
# dossier, exported as STIX `indicator --indicates--> intrusion-set`, listed
# in the SIEM CSV, and stored in the persistent graph as actor-reported
# infrastructure.
#
# The result: a Cobalt Strike C2 server used by one ransomware crew appeared
# as APT28 infrastructure because both groups use Cobalt Strike. The graph
# then answered "is APT28 connected to this IP?" with CONNECTED, bridged by
# the shared tool.
#
# Anything listed here is skipped by family-level IOC enrichment unless
# --include-shared-tooling is passed, and anything collected that way is
# tagged attribution: shared_tool so reporters can keep it out of blocking
# lists.
#
# This is about AMBIGUITY, not legitimacy: a tool belongs here if many
# unrelated actors use it, whether it is criminal, commercial or built in.
# ---------------------------------------------------------------------------

shared_tooling:
