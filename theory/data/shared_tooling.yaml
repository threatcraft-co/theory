  - Cobalt Strike
  - Sliver
  - Brute Ratel C4
  - Metasploit
  - Meterpreter
  - Empire
  - PoshC2
  - Covenant
  - Havoc
  - Mythic
  - Pupy
  - QuasarRAT
  - Koadic

  # ── Credential access ──
